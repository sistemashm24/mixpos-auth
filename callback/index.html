<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinculando con MixPOS...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: #111827;
            --border-color: #1f2937;
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(2, 132, 199, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.08) 0%, transparent 40%);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px 32px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .icon-container {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(2, 132, 199, 0.15);
            border: 2px solid rgba(2, 132, 199, 0.3);
            position: relative;
        }

        .icon-container.success {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.4);
            color: var(--success);
        }

        .icon-container.error {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.4);
            color: var(--danger);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 13px 20px;
            background: var(--primary);
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6);
        }

        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card" id="card">
        <div class="icon-container" id="icon-box">
            <div class="spinner" id="spinner"></div>
            <svg id="icon-success" style="display:none; width:36px; height:36px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
            </svg>
            <svg id="icon-error" style="display:none; width:36px; height:36px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </div>

        <div class="badge">
            <span class="badge-dot" id="badge-dot"></span>
            <span id="badge-text">Mercado Pago Point</span>
        </div>

        <h1 id="title">Conectando con MixPOS...</h1>
        <p id="description">Estamos transfiriendo la autorización a tu punto de venta. Por favor espera un momento.</p>

        <a id="btn-action" href="#" class="btn" style="display:none;">Volver a MixPOS</a>

        <div class="footer-note" id="footer-note">Si esta ventana no se cierra automáticamente, puedes hacer clic arriba.</div>
    </div>

    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const state = urlParams.get('state');
            const error = urlParams.get('error');
            const errorDesc = urlParams.get('error_description');

            const localTarget = "http://127.0.0.1:8089/callback/" + window.location.search;

            const iconBox = document.getElementById('icon-box');
            const spinner = document.getElementById('spinner');
            const iconSuccess = document.getElementById('icon-success');
            const iconError = document.getElementById('icon-error');
            const title = document.getElementById('title');
            const desc = document.getElementById('description');
            const btn = document.getElementById('btn-action');
            const badgeDot = document.getElementById('badge-dot');
            const badgeText = document.getElementById('badge-text');

            if (error) {
                spinner.style.display = 'none';
                iconBox.classList.add('error');
                iconError.style.display = 'block';
                badgeDot.style.background = 'var(--danger)';
                badgeDot.style.boxShadow = '0 0 8px var(--danger)';
                badgeText.innerText = 'Autorización cancelada';
                title.innerText = 'No se completó la vinculación';
                desc.innerText = errorDesc || 'La autorización fue denegada o expiró. Puedes intentarlo de nuevo desde MixPOS.';
                btn.href = localTarget;
                btn.innerText = 'Cerrar y Regresar a MixPOS';
                btn.style.display = 'inline-flex';
                return;
            }

            if (code) {
                // Éxito: Mostrar estado positivo y redirigir al listener local de MixPOS
                spinner.style.display = 'none';
                iconBox.classList.add('success');
                iconSuccess.style.display = 'block';
                badgeText.innerText = 'Autorización exitosa';
                title.innerText = '¡Cuenta vinculada con éxito!';
                desc.innerText = 'Guardando tus terminales Point en MixPOS... Ya puedes cerrar esta ventana.';
                btn.href = localTarget;
                btn.innerText = 'Abrir MixPOS';
                btn.style.display = 'inline-flex';

                // Redirección inmediata al puerto local de MixPOS
                setTimeout(() => {
                    window.location.replace(localTarget);
                }, 400);
            } else {
                // Sin parámetros
                spinner.style.display = 'none';
                iconBox.classList.add('error');
                iconError.style.display = 'block';
                title.innerText = 'Parámetros no encontrados';
                desc.innerText = 'Esta página es el puente de autorización entre Mercado Pago y MixPOS. Inicia el proceso desde la aplicación.';
            }
        })();
    </script>
</body>
</html>
